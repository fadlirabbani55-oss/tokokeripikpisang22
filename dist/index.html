<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keripik Pisang Salee — Website E-Commerce & Dashboard Manajemen UMKM</title>
  <!-- Google Fonts: Plus Jakarta Sans & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Konfigurasi Identitas Visual Modern Tropical Food Branding -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Poppins', 'Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            salee: {
              yellow: '#F5C84C', // Kuning pisang
              brown: '#633D25',  // Cokelat
              cream: '#FFF5DF',  // Cream
              green: '#557447',  // Hijau daun
              white: '#FFFFFF',  // Putih
            },
          },
        },
      },
    };
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client (Ready for Cloud Integration) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF5DF;
      color: #633D25;
    }
    h1,
    h2,
    h3,
    h4,
    .font-display {
      font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FFF5DF;
    }
    ::-webkit-scrollbar-thumb {
      background: #633D25;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #557447;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-[#F5C84C] selection:text-[#633D25]">
  <!-- Container Notifikasi Toast -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2.5 pointer-events-none"></div>
  <!-- Root Aplikasi Interaktif (Storefront Pelanggan & Dashboard Admin) -->
  <div id="appRoot"></div>
  <!-- Modul Konfigurasi Admin Lokal, Database Relasional (8 Tabel) & Aplikasi Utama -->
  <script src="./src/config/adminAuthConfig.js"></script>
  <script src="./src/runtime/database.js"></script>
  <script src="./src/runtime/app.js"></script>
</body>
</html>
